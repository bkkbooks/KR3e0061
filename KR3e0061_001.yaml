body:
  text: 局方發揮元朱震亨撰和劑局方之為書也可以據證檢方即方用藥不必求醫不必修製尋贖見成丸散病痛便可安痊仁民之意可謂至矣自宋迄今官府守之以為法醫門傳之以為業病者恃之以立命世人習之以成俗然豫竊有疑焉何者古人以神聖工巧言醫又曰醫者意也以其傳授雖的造詣雖深臨機應變如對敵之將操舟之工自非盡君子隨時取中之妙寧無愧於醫乎今乃集前人已效之方應今人無限之病何異刻舟求劍按圗索驥冀其偶中也難矣或曰仲景治傷寒著三百一十三方治雜病著金匱要略二十有三門厯代名方汗牛充棟流傳至今明效大驗顯然耳目今吾子致疑於局方無乃失之謬妄乎豫曰醫之視病問證已得病之情矣然病者一身血氣有淺深體段有上下臟腑有內外時月有久近形志有苦樂資禀有厚薄能毒有可否標本有先後年有老弱治有五方令有四時某藥治某病某經用某藥孰為正治反治孰為君臣佐使合是數者計較分毫議方治療貴乎適中今觀局方别無病源議論止於各方條述證候繼以藥石之分兩修製藥餌之法度而又勉其多服常服久服殊不知一方通治諸病似乎立法簡便廣絡原野冀獲一兔寧免許學士之誚乎仲景諸方實萬世醫門之規矩凖繩也後之欲為方圓平直者必於是而取則焉然猶設為問難藥作何應處以何法許學士亦曰我善讀仲景書而知其意然未嘗全用其方局方制作將擬仲景耶故不揣荒陋敢陳管見倘䝉改而正諸實為醫道之幸今世所謂風病大率與諸痿證混同論治良由局方多以治風之藥通治諸痿也古聖論風論痿各有篇目源流不同治法亦異不得不辨按風論風者百病之長至其變化乃為他病又曰善行數變曰因於露風曰先受邪曰在腠理曰客曰入曰傷曰中厯陳五臟與胃之傷皆多汗而惡風其發明風邪係外感之病有臟腑內外虛實寒熱之不同若是之明且盡也别無癱瘓痿弱卒中不省僵仆喎斜攣縮眩暈語澀不語之文新舊所録治風之方凡十道且即至寶丹靈寶丹論之曰治中風不語治中風語澀夫不語與語澀其可一例看乎有失音不語有舌強不語有神昏不語有口禁不語有舌縱語澀有舌麻語澀治大腸風祕祕有風熱有風虛曽謂一方可通治乎又曰治口鼻血出夫口鼻出血皆是陽盛隂虛有升無降血隨氣上越出上竅法當補隂抑陽氣降則血歸經豈可以輕揚飛竄之腦麝佐之以燥悍之金石乎又曰治皮膚燥癢經曰諸癢為虛血不榮肌腠所以癢也當與滋補藥以養隂血血和肌潤癢自不作豈可以一十七兩重之金石佐以五兩重之腦麝香桂而欲以一兩重之當歸和血一升之童便活血一升之生地黃汁生血夫枯槁之血果能和而生乎果能潤澤肌肉之乾瘦乎又曰治難産死胎血脉不行此血氣滯病也又曰治神魂恍惚久在牀枕此血氣虛病也夫治血以血藥治虛以補藥彼燥悍香竄之劑固可以劫滯氣果可以治血而補虛乎潤體丸等三十餘方皆曰治諸風治一切風治一應風治男子三十六種風其所主治甚為浩博且寒熱虛實判然逈别一方通治果合經意乎果能去病乎龍虎丹排風湯俱係治五臟風而排風又曰風發又似有內出之意夫病既在五臟道逺而所感深一則用麻黃三兩以發其表一則用腦麝六兩以瀉其衛而謂可以治臟病乎借曰在龍虎則有寒水石一斤以為鎮墜在排風則有白术當歸以為補養此殆與古人輔佐因用之意合吁臟病屬裏而用發表瀉衛之藥寧不犯誅伐無過之戒乎寧不助病邪而伐根本乎骨碎補丸治肝腎風虛乳香宣經丸治體虛換腿丸治足三隂經虛或因感風既曰體虛肝腎虛足三隂經虛病非輕小理宜補養而自然銅半夏葳靈荆芥地龍川練烏藥防風牽牛靈脂草烏羌活石南天麻南星檳榔等疏通燥疾之藥居補劑之大半果可以補虛乎七聖散之治風濕流注活血應痛丸之治風濕客腎經微汗以散風𨗳水以行濕仲景法也觀其用藥何者為散風何者謂行濕吾不得而知也三生飲之治外感風寒內傷喜怒或六脉沉伏或指下浮盛及痰厥氣虛大有神效治外感以發散仲景法也治內傷以補養東垣法也誰能易之脉之沈伏浮盛其寒熱表裏虛實之相逺若水火然似難同藥痰厥因於寒或能成功血氣虛者何以收救已上諸疑特舉其顯者耳若毫分縷析更僕未易盡也姑用置之忘言或曰吾子謂內經風論主於外感其用麻黃桂枝烏附輩將以解風寒也其用腦麝葳靈仙黑牽牛輩將以行凝滯也子之言過矣豫應之曰風病外感善行數變其病多實少虛發表行滯有何不可治風之外何為又厯述神魂恍惚起便須人手足不隨神志昏憒癱瘓嚲曳手足筋衰眩暈倒仆半身不遂腳脉緩弱四肢無力顫掉拘攣不語語澀諸痿等證悉皆治之考諸痿論肺熱葉焦五臟因而受之發為痿躄心氣熱生脉痿故脛縱不任地肝氣熱生筋痿故宗筋弛縱脾氣熱生肉痿故痺而不仁腎氣熱生骨痿故足不任身又曰諸痿皆屬於上謂之上者指病之本在肺也又曰昏惑曰瘛瘲曰瞀悶曰瞀昧曰暴病曰鬱冒曰曚昧曰暴瘖曰瞀瘛皆屬於火又曰四肢不舉曰舌本強曰足痿不收曰痰涎有聲皆屬於土又禮記注曰魚肉天産也以養陽作陽德以為倦怠悉是濕熱內傷之病當作諸痿治之何局方治風之方兼治痿者十居其九不思諸痿皆起於肺熱傳入五臟散為諸證大抵只宜補養若以外感風邪治之寧免實實虛虛之禍乎或曰經曰諸風掉眩皆屬於肝諸暴強直皆屬於風至於掉振不能久立善暴僵仆皆以為木病肝屬木風者木之氣曰掉曰掉振非顫掉乎曰眩非眩暈乎曰不能久立非筋衰乎非緩弱無力乎曰諸暴強直非不隨乎曰善暴僵仆又曰瞀悶曰瞀昧曰暴病曰鬱冒曚昧暴瘖曰瞀瘛與上文所謂屬肝屬風屬水之病相似何為皆屬於火曰舌本強曰痰涎有聲何為皆屬於土痿論俱未嘗言及而吾子合火土二家之病而又與倦怠並言總作諸痿治之其將有說以通之乎豫應之曰按原病式曰風病多因熱甚俗云風者言末而忘其本也所以中風而有癱瘓諸證者非謂肝木之風實甚而卒中之也亦非外中於風良由將息失宜腎水虛甚則心火暴盛水不制火也火熱之氣怫鬱神明昏冒筋骨不用而卒倒無所知也亦有因喜怒思悲恐五志過極而卒中者五志過熱甚故也又原病曰脾之脉連舌本散舌下今脾臟受邪故舌強又河間曰謂膈熱甚火氣炎上傳化失常故津液涌而為痰涎潮上因稠粘難出故作聲也一以屬脾一以為胃熱謂之屬火與土不亦宜乎雖然岐伯仲景孫思邈之言風大意似指外邪之感劉河間之言風明指內傷熱證實與痿論所言諸痿生於熱相合外感之邪有寒熱虛實而挾寒者多內傷之熱皆是虛證無寒可散無實可瀉局方本為外感立方而以內傷熱證混同出治其為害也似非細故或曰風分內外痿病因熱既得聞命矣手陽明大腸經肺之腑也足陽明胃經脾之腑也治痿之法取陽明一經此引而未發之言願明以告我豫曰諸痿生於肺熱只此一句便見治法大意經曰東方實西方虛瀉南方補北方此固是就生尅言補瀉而大經大法不外於此東方木肝也西方金肺也南方火心也北方水腎也五行之中惟火有二腎雖有二水居其一陽常有餘隂常不足故經曰一水不勝二火理之必然肺金體燥而居上主氣畏火者也脾土性濕而居中主四肢畏木者也火性炎上若嗜欲無節則水失所養火寡於畏而侮所勝肺得火邪而熱矣木性剛急肺受熱則金失所養木寡於畏而侮所勝脾得木邪而傷矣肺熱則不能管攝一身脾傷則四肢不能為用而諸痿之病作瀉南方則肺金清而東方不實何脾傷之有補北方則心火降而西方不虛何肺熱之有故陽明實則宗筋潤能束骨而利機關矣治痿之法無出於此駱隆吉亦曰風火既熾當滋腎水東垣先生取黃蘗為君黃茋等補藥輔佐之以治諸痿而無一定之方有兼痰積者有濕多者有熱多者有濕熱相半者有挾氣者臨病製方其善於治痿者乎雖然藥中肯綮矣若將理失宜聖醫不治也天産作陽厚味發熱先哲格言但是患痿之人若不淡薄食味吾知其必不能安全也或曰小續命湯與要略相表裏非外感之藥乎地仙丹治勞傷腎憊非內傷之藥乎其將何以議之豫曰小續命湯比要略少當歸石膏多附子防風防己果與景意合否也仲景謂汗出則止藥局方則曰久服差又曰久病風隂晦時更宜與又曰治諸風似皆非仲景意然麻黃防己可久服乎諸風可通治乎地仙丹既曰補腎而滋補之藥與僣燥走竄之藥相半用之腎惡燥而謂可以補腎乎借曰足少隂經非附子輩不能自達八味丸仲景腎經藥也八兩地黃以一兩附子佐之觀此則是非可得而定矣非吾之過論也又觀治氣一門有曰治一切氣冷氣滯氣逆氣上氣用安息香丸丁沈丸大沈香丸蘇子丸勻氣散如神丸集香丸白檀香丸煨薑丸鹽煎散七氣湯丸痛溫白丸生薑湯其治嘔吐膈噎也用五膈丸五膈寬中散膈氣散酒癥丸草豆蔲丸撞氣丸人參丁香散其治吞酸也用丁沈煎丸小理中丸其治痰飲也用倍术丸消飲丸溫中化痰丸五套丸且於各方條下或曰口苦失味曰噫酸曰舌澀曰吐清水曰痞滿曰氣急曰脅下急痛曰五心中熱口爛生瘡皆是明著熱證何為率用熱藥夫周流於人之一身以為生者氣也陽往則隂來隂往則陽來一升一降無有窮已茍內不傷於七情外不感於六淫其為氣也何病之有今曰冷氣滯氣逆氣上氣皆是肺受火邪氣得炎上之化有升無降薰蒸清道甚而至於上焦不納中焦不化下焦不滲展轉傳變為嘔為吐為膈為噎為痰為飲為翻胃為吞酸夫治寒以熱治熱以寒此正治之法也治熱用熱治寒用寒此反佐之法也詳味前方既非正治又非反佐此愚之所以不能無疑也謹按原病式曰諸嘔吐酸皆屬於熱諸積飲痞膈中飲皆屬於濕諸氣逆衝上嘔涌溢食不下皆屬於火諸堅痞腹滿急痛吐腥穢皆屬於寒深契仲景之意金匱要略曰胸痺病胸背痛括蔞薤白湯主之胸痺心痛徹背括蔞薤白半夏湯主之心下痞氣氣結在胸脅下上逆搶心者枳實薤白括蔞桂枝湯主之嘔而心下痞者半夏瀉心湯主之乾嘔而利者黃芩加半夏生薑湯主之諸嘔吐穀不得入者小半夏湯主之嘔吐病在膈上者猪苓湯主之胃反嘔吐者半夏參蜜湯主之食已即吐者大黃甘草湯主之胃反吐而渴者茯苓澤瀉湯主之吐後欲飲者文蛤湯主之病似嘔不嘔似噦不噦心中無奈者薑汁半夏湯主之乾嘔手足冷者陳皮湯主之噦逆者陳皮竹茹湯主之乾嘔下痢者黃芩湯主之氣衝上者皂莢丸主之上氣脉浮者厚朴麻黃湯主之上氣脉沈者澤瀉湯主之大逆上氣者麥門冬湯主之心下有痰飲胸脅支滿目眩茯苓桂术湯主之短氣有微飲當從小便出之宜茯苓桂术甘草湯腎氣丸亦主之病者脉伏其人欲自利利者反快雖利心下續堅滿者此為流飲欲去故也甘遂半夏湯主之病懸飲者十棗湯主之病溢飲者當發其汗宜大青龍湯又宜用小青龍湯心下有支飲其人若冒眩澤瀉湯主之支飲胸滿者厚朴大黃湯主之支飲不得息葶藶大棗瀉肺湯主之嘔家本渴今反不渴心中有支飲故也小半夏湯主之卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓湯主之假令瘦人臍下有悸者吐涎沫而頭眩水也五苓散主之心胸有停痰宿水自吐水後心胸間虛氣滿不能食消痰氣令能食茯苓飲主之先渴後嘔為水停心下此屬飲家半夏加茯苓湯主之觀其微意可表者汗之可下者利之滯者𨗳之鬱者揚之熱者清之寒者溫之偏寒偏熱者反佐而行之挾濕者淡以滲之挾虛者補而養之何嘗例用辛香燥熱之劑以火濟火實實虛虛咎將誰執或曰脉訣謂熱則生風冷則生氣寒主收引今冷氣上衝矣氣逆矣氣滯矣非冷而何吾子引仲景之言而斥其非然則諸氣諸飲嘔吐反胃吞酸等病將無寒證耶豫曰五臟各有火五志激之其火隨起若諸寒為病必須身犯寒氣口得寒物乃為病寒非若諸火病自內作所以氣之病寒者十無一二或曰其餘痰氣嘔吐吞酸噎膈反胃作熱作火論治於理可通若病人自言冷氣從下而上者非冷而何豫曰上升之氣自肝而出中挾相火自下而出其熱為甚自覺其冷非真冷也火極似水積熱之甚陽亢隂微故見此證冷生氣者出髙陽生之謬言也若病果因感寒當以去寒之劑治之何至例用辛香燥熱為方不知權變寧不誤人或曰氣上升者皆用黑錫丹養正丹養氣丹等藥以為鎮墜然服之者隨手得效若子以為熱甚之病亦將有誤耶豫曰相火之外又有臟腑厥陽之火五志之動各有火起相火者此經所謂一水不勝二火之火出于天造厥陽者此經所謂一水不勝五火之火出於人欲氣之升也隨火炎上升而不降孰能禦之今人欲借丹劑之重墜而降之氣鬱為濕痰丹性熱燥濕痰被劫亦為暫開所以清快丹毒之發偏助狂火隂血愈耗其升愈甚俗人喜溫迷而不返被此禍者滔滔皆是或曰丹藥之墜欲降而升然則如之何則可豫曰投以辛涼行以辛溫制伏肝邪治以鹹寒佐以甘溫收以苦甘和以甘淡補養隂血陽自相附隂陽比和何升之有先哲格言其則不逺吾不贅及或曰吐酸素問明以為熱東垣又言為寒何也豫曰吐酸與吞酸不同吐酸是吐出酸水如醋平時津液隨上升之氣鬱積而成鬱積之久濕中生熱故從火化遂作酸味非熱而何其有積之於久不能自涌而出伏於肺胃之間咯不得上咽不得下肌表得風寒則內熱愈鬱而酸味刺心肌表溫暖腠理開發或得香熱湯丸津液得行亦得暫解非寒而何素問言熱者言其本也東垣言寒者言其末也但東垣不言外得風寒而作收氣立說欲瀉肺金之實又謂寒藥不可治酸而用安胃湯加減二陳湯俱犯丁香且無治熱濕鬱積之法為未合經意豫嘗治吞酸用黃蓮茱茰各製炒隨時令迭為佐使蒼术茯苓為主病湯浸炊餅為小丸吞之仍教以粗食蔬菜自養則病易安或曰蘇合香丸雖是類聚香藥其治骨蒸殗殜月閉狐狸等病吾子以為然乎豫曰古人製方用藥羣隊者必是攻補兼施彼此相制氣味相次孰為主病孰為引經或用正治或用反佐各有意義今方中用藥一十五味除白术朱砂訶子共六兩其餘一十二味共二十一兩皆是性急輕竄之劑往往用之於氣病與暴仆昏昧之人其衝突經絡漂蕩氣血若摧枯拉朽然不特此也至如草豆蔲散教人於夏月濃煎以代熟水夫草豆蔲性大熱去寒邪夏月有何寒氣而欲多服縮脾飲用草果亦是此意且夏食寒所以養陽也草豆蔲草果其食寒之意乎不特此也抑又有甚者焉接氣丹曰陽氣暴絶當是隂先虧隂先虧則陽氣無所依附遂至飛越而暴絶也上文乃曰隂氣獨盛隂氣若盛陽氣焉有暴絶之理假令陽氣暴絶宜以滋補之劑保養而鎮靜之庶乎其有合夏食寒以為養陽之本何至又服辛香燥熱之劑乎且此丹下咽暴絶之陽果能接乎孰為是否君其算之或曰局方言隂盛隂邪盛也隂邪既盛陽有暴絶之理子之所言與陽氣相對待之隂也果有隂虧而陽絶者吾子其能救之乎豫曰隂陽二字固以對待而言所指無定在或言寒熱或言血氣或言臟腑或言表裏或言動靜或言虛實或言清濁或言竒偶或言上下或言正邪或言生殺或言左右求其立言之意當是隂鬼之邪耳隂鬼為邪自當作邪鬼治之若隂先虧而陽暴絶者嘗治一人矣浦江鄭兄年近六十奉養受用之人也仲夏久患滯下而又犯房勞忽一晚正走厠間兩手舒撒兩眼開而無光尿自出汗如雨喉如拽鋸呼吸甚微其脉大而無倫次無部位可畏之甚余適在彼急令煎人參膏且與灸氣海穴艾炷如小指大至十八壯右手能動又三壯脣微動參膏亦成遂與一盞至半夜後盡三盞眼能動盡二斤方能言而索粥盡五斤而利止十斤而安或曰諸氣諸飲與嘔吐吞酸膈噎反胃等證局方未中肯綮我知之矣然則要略之方果足用乎抑猶有未發者乎豫曰天地氣化無窮人身之病亦變化無窮仲景之書載道者也醫之良者引例推類可謂無窮之應用借令略有加減修合終難踰越矩度夫氣之初病也其端甚微或因些少飲食不謹或外冒風雨或內感七情或食味過厚偏助陽氣積成膈熱或資禀充實表密無汗或性急易怒火炎上以致津液不行清濁相干氣為之病或痞或痛或不思食或噫腐氣或吞酸或嘈雜或膨滿不求原本便認為寒遽以辛香燥熱之劑投之數帖時暫得快以為神方厚味仍前不節七情反覆相仍舊病被劫暫開濁液易於攢聚或半月或一月前證復作如此延蔓自氣成積自積成痰此為痰為飲為吞酸之由也良工未遇繆藥又行痰挾瘀血遂成窠囊此為痞為痛嘔吐為噎膈反胃之次第也飲食湯液滯泥不行滲道蹇澀大便或祕或溏下失傳化中焦愈停醫者不察猶執為冷翻思前藥隨手得快至此賓主皆恨藥缺燥熱顒伺久服可以溫脾健胃消積行氣以冀一旦豁然之效不思胃為水穀之海多血多氣清和則能受脾為消化之氣清和則能運今久得香熱之偏助氣血沸騰其始也胃液凝聚無所容受其久也脾氣耗散傳化漸遲其有胃熱易飢急於得食脾傷不磨鬱積成痛醫者猶曰虛而積寒非尋常草木可療徑以烏附助佐丹劑專意服餌積而久也血液俱耗胃脘乾槁其槁在上近咽之下水飲可行食物難入間或可入亦不多名之曰噎其槁在下與胃為近食雖可入難盡入胃良久復出名之曰膈亦曰反胃大便祕少若羊矢然名雖不同病出一體要略論飲有六曰痰飲懸飲溢飲支飲留飲伏飲分别五臟諸證治法至矣盡矣苐恨醫者不善處治病者不守禁忌遂使藥助病邪展轉深痼去生漸逺深可哀憫或曰千金諸方治噎膈反胃未嘗廢薑桂等劑何子之多言也豫曰氣之鬱滯久留淸道非借香熱不足以行然悉有大黃石膏竹茹芒硝澤瀉前胡朴硝茯苓黃芩蘆根括蔞等藥為之佐使其始則同其終則異病邪易伏其病自安或曰胃脘乾槁者古方果可治乎將他有要捷之法者或可補前人之未發者乎豫曰古方用人參以補肺御米以解毒竹瀝以清痰乾薑以養血粟米以實胃蜜水以潤燥薑以去穢正是此意張雞峯亦曰噎當是神思間病惟內觀自養可以治之此言深中病情而施治之法亦為近理夫噎病生於血乾夫血隂氣也隂主靜內外兩靜則臟腑之火不起而金水二氣有養隂血自生腸胃津潤傳化合宜何噎之有因觸類而長曾製一方治中年婦人以四物湯加和白陳皮留尖桃仁生甘草酒紅花濃煎入驢尿飲以防其或生蟲也與數十帖而安又台州治一匠者年近二十勤於工作而有艾妻且喜酒其面白其脉澀重則大而無力乃令謝去工作卧於牛家取新溫牛乳細飲之每䪺盡一杯一晝夜可飲五七次盡郤食物以漸而至八九次半月大便潤月餘而安然或口乾蓋酒毒未解間飲甘蔗汁少許或者又曰古方之治噎膈反胃未有不言寒者子何不思之甚豫曰古人著方必為當時抱病者設也其人實因於寒故用之而得效後人遂録以為矜式不比局方泛編成書使天下後世之人凡有此證者率遵守以為之定法而專以香熱為用也雖然挾寒者亦或有之但今人之染此病率因痰氣久得醫藥傳變而成其為無寒也明矣或曰治脾腎以溫補藥豈非局方之良法耶吾子其將何以議之豫曰衆言淆亂當折諸聖切恐脾腎有病未必皆寒觀其養脾丸治脾胃虛冷體倦不食嘉禾散治脾胃不和不能多食消食丸治脾胃俱虛飲食不下小獨聖丸治脾胃不和不思飲食大七香丸治脾冷胃虛不思飲食連翹丸治脾胃不和飲食不下分氣紫蘇飲治脾胃不和木香餅子治脾胃虛寒溫中良薑丸曰溫脾胃奪命抽刀散曰脾胃冷燒脾散曰脾胃虛進食散曰脾胃虛冷不思飲食丁香煮散曰脾冷胃寒二薑丸曰養脾溫胃薑合丸曰脾胃久虛蓬煎丸曰脾胃虛弱守金丸曰脾胃虛冷集香丸曰脾胃不和蟠蔥散曰脾胃虛冷壯脾丸曰脾胃虛弱人參丁香散曰脾胃虛弱人參煮散曰脾胃不和丁沈透膈湯曰脾胃不和丁香五套丸曰脾胃虛弱腽肭臍丸之壯氣暖腎兔絲子丸之治腎虛金叉石斛丸之治氣不足茴香丸之治臟虛冷玉霜丸之治氣虛安腎丸之治腎積寒麝香鹿茸丸之益氣養正丹之治諸虛朴附丸之治脾胃虛弱接氣丹之治真氣虛四神丹之治五臟沉香鹿茸丸之治氣不足椒附丸之溫五臟蓯蓉大補丸之治五臟元氣虛鍾乳白澤丸之治諸虛三建湯之治氣不足甚者類聚丹劑悉曰補脾胃溫脾胃補腎補五臟補真氣而各方條下曰舌苦曰面黃曰舌苦無味曰中酒吐酒曰酒積曰酒癖曰飲酒多曰酒過傷曰氣促喘急曰口淡曰舌澀曰噫醋曰舌乾曰溺數曰水道澀痛曰小便出血曰口苦曰咽乾曰氣促曰盜汗曰失精曰津液內燥曰氣上衝曰外腎癢曰枯槁失血曰口脣乾燥曰喘滿曰肢體煩疼曰衄血曰小便淋瀝悉是明具熱證如何類聚燥熱而謂可以健脾溫胃而滋腎補氣乎經曰熱傷脾常服燥寧不傷脾乎又曰腎惡燥多服燥熱寧不傷腎乎又曰熱傷元氣久服燥熱寧不傷氣乎又曰用熱逺熱又曰有熱者寒而行之此教人用熱藥之法蓋以熱藥治寒病茍無寒藥為之嚮導佐使則病拒藥而扞格不入謂之逺熱者行之以寒也兩句同一意恐後人不識此理故重言以明之今局方辛香燥熱以類聚之未嘗見其所謂逺熱也用熱而不逺熱非惟不能中病抑且正氣先傷醫云乎哉夫良醫之治病也必先求其得病之因其虛邪也當治其母實邪也當治其子微邪也當治其所勝賊邪也當治其所不勝正邪也當治其本經索矩又謂雜合受邪病者所受非止一端又須察其有無雜合之邪輕重較量視標本之緩急以為施治之先後今乃一切認為寒冷吾不知脾胃與腎一向只是寒冷為病耶論方至此雖至愚昧不能不致疑也吾又考之要略矣諸嘔吐穀不得入者小半夏湯主之疸病寒熱不食食則頭眩心胸不安者茵陳湯主之身腫而冷胸窒不能食病在骨節發汗則安心胸停痰吐水虛滿不能食者茯苓湯主之中風手足拘急惡寒不欲飲食者三黃湯主之下利不欲飲食者大承氣湯主之五勞虛極羸瘦不能食者大黃䗪蟲丸主之虛勞不足汗出而悶脉結心悸者炙甘草湯主之虛勞腰痛小腹拘急者八味丸主之虛勞不足者大薯蕷丸主之虛勞虛煩不得眠者酸棗仁湯主之夫嘔者胸滿者吐水者下利者惡寒者腫而冷者不能飲食者虛勞羸瘦者虛勞汗而悸者虛勞而腰痛者虛勞不足者虛勞煩而不眠者自局方之法觀之寧不認為寒冷而以熱藥行之乎仲景施治則不然也痰者導之熱者清之積者化之濕者滲之中氣淸和自然安裕虛者補之血凝者散之躁者寧之熱者和之隂氣清寧何虛勞之有也或曰傷寒一門雖取雜方仲景之法亦摘取之矣吾子其忘言乎豫曰傷寒之法仲景而下發明殆盡局方是否愚不必贅雖然仲景論傷寒矣而未及乎中寒先哲治胃大寒而昏中者用附子理中湯而安其議藥則得之矣曰傷曰中未聞有議其異同之者豫俯而思之傷寒有即病有不即病必大發熱病邪循經而入以漸而深中寒則倉卒感受其病即發而暴傷寒之人因其舊有鬱熱風寒外束肌腠自密鬱發為熱其初也用麻黃桂枝輩微表而安以病體不甚虛也中寒之人乘其腠理疏豁一身受邪難分經絡無熱可發溫補自解此謂氣之大虛也傷寒熱雖甚不死中寒若不急治去生甚逺其虛實蓋可見矣或曰脾胃一門子以局方用藥太熱未合經意若平胃散之溫和可以補養胃氣吾子以為何如豫曰蒼术性燥氣烈行濕解表甚為有力厚朴性溫散氣非脹滿實急者不用承氣湯用之可見矣雖有陳皮甘草之甘緩甘辛亦是决裂耗散之劑實無補土之和經謂土氣太過曰敦阜亦能為病況胃為水穀之海多氣多血故因其病也用之以瀉有餘之氣使之平爾又須察其挾寒得寒物者投之胃氣和平便須郤藥謂之平者非補之之謂其可常服乎或曰調胃承氣亦治胃病謂之調者似與平胃散之平意義相近何用藥之相逺也豫曰調胃承氣治熱中下二焦藥也經曰熱淫於內治以鹹寒佐以苦甘功在乎導利而行之以緩平胃散止治濕上焦之藥也經曰濕上甚而熱治以苦溫佐以甘辛以汗為效而止或曰治濕不利小便非治也非仲景法耶何子言之悖也豫曰淡滲治濕以其濕在中下二焦今濕在上宜以微汗而解不欲汗多故不用麻黃乾葛輩積而至久溼熱之禍有不可勝言者僅有桑椹煎無毒可以解渴其餘味之美者並是嬉笑作罪然乎否乎或曰婦人一門無非經候胎産帶下用藥溫暖於理頗通吾子其無忘言乎豫曰婦人以血為主血屬隂易於虧缺非善調攝者不能保全也餘方是否姑用置之若神仙聚寶丹則有不能忘言者其方治血海虛寒虛熱盜汗理宜補養琥珀之燥麝香之散可以用乎面色痿黃肢體浮腫理宜導濕乳香沒藥固可治血可以用乎胎前産後虛實不同逐敗養新攻補難並積塊堅癥赤白崩漏宜於彼者不必效於此而欲以一方通治乎世人以其貴細溫平又喜其常服可以安神去邪令人有子殊不知積溫成熱香竄散氣服者無不被禍自非五臟能言醫者終不知覺及至變生他病何曾歸咎此丹余姪女形色俱實以得子之遲服此藥背上發癰證候甚危余診其脉散大而澀急以加減四物湯百餘帖補其隂血幸其質厚易於收救隨用大承氣湯利之始安婦人或中風或傷寒經水適來適斷有寒熱皆為熱入血室今局方不曾言病而所謂寒與熱者其因何在其病何名果無雜合所受邪果無時令資禀之當擇耶據外證之寒熱而遂用之果無認假為真耶果無以是為非耶或曰以寒熱為篇目固未合經意若其諸方果有用乎豫曰以積熱為篇目固有可議若諸方之制作取用儘有妙理吾其為子發明前人之意恐可為用方者涓埃之助夫紫雪者心脾肝腎胃經之藥也通中散洗心散表裏血氣之藥也涼膈散心肺脾胃之藥也龍腦飲子勝氷丹真珠散靈液丹上中二焦之藥也碧雪雞蘇丸三黃丸八正散三焦藥也甘露丸心脾肝之藥也涼膈丸心脾胃之藥也抱龍丸麥門冬散心肺肝之藥也妙香丸疏快腸胃制伏木火藥也甘露飲心肺胃藥也五淋散血而裏藥也消毒飲氣而表藥也麻仁丸氣而裏藥也導赤丸氣與血而裏藥也導赤散心小腸藥也有升有降有散有補有滲導有驅逐有因用有引經或緩之以甘或收之以酸或行之以香或因之以蠟或燥之以苦觀其立方各有所主用方之人宜求其意若夫痼冷門尤有可議者冷即寒也內經以寒為殺厲之氣今加痼於冷之上豈非指身惡寒而口喜熱之病耶若以此外證便認為痼冷宜乎夏英公之常餌烏附常御綿帳不知濕痰積中抑遏陽氣不得外泄身必惡寒經曰亢則害承乃制又劉河間曰火極似水故見此證當治以鹹寒佐以甘溫視標本之先後正邪之虛實孰緩孰急為之治法何至類用烏附丹劑僣燥之藥抱薪救火屠劊何異古人治戰栗有以大承氣湯下之而愈者惡寒戰栗明是熱證亦有因久服熱藥而得之者但有虛實之分耳進士周本道年近四十得惡寒證服附子數日而病甚求余治診其脉弦而似緩遂以江茶入薑汁香油些少吐痰一升許減綿大半與通聖散去麻黃大黃芒硝加當歸地黃百餘貼而安又一色目婦人年近六十六月內常覺惡寒戰栗喜啖熱御綿多汗如雨其形肥肌厚已得附子三十餘但渾身癢甚兩手脉沈澀重取稍大知其熱甚而血虛也以四物湯去川芎倍地黃加白术黃茋炒蘗生甘草人參每貼二兩重方與一帖腹大泄目無視口無言豫知其病熱深而藥無反佐之過也仍取前藥熟炒與之蓋借火力為嚮導一帖利止四帖精神回十帖病全安又蔣氏婦年五十餘形瘦面黑六月喜熱惡寒兩手脉沈而澀重取似數以三黃丸下以薑汁每三十粒三十帖微汗而安彼以積熱痼冷為叙方之篇目其得失可知矣泄痢一門其用鍾乳健脾丸朝真丸駐車丸訶梨勒丸大溫脾丸黃蓮阿膠丸胡粉丸桃花丸訶梨勒散木香散七棗湯赤石脂散養臟湯御米湯金粟湯狗頭骨丸豆蔻丸肉豆蔻散三神丸丁香豆蔻散止瀉丸皆用熱藥為主治以澀藥為佐使當為腸虛感寒而成滑利者設也彼瀉痢者將無熱證耶將無積滯耶內經曰春傷於風夏為膿血多屬滯下夫瀉痢證其類尤多先賢曰濕多成瀉此確論也曰風曰濕固不可得而通治矣況風與濕之外又有雜合受邪似難例用澀熱之劑今方中書證有兼治裏急者有兼治後重者有兼治裏急後重者此豈非滯下之病乎今瀉痢與滯下混同論治實實虛虛之患將不俟終日矣或曰然則瀉痢與滯下為病不同治法亦别吾子其能通之乎豫曰經曰暴注下迫皆屬於熱又曰暴注屬於火又下痢清白屬於寒熱君火之氣火相火之氣寒寒水之氣屬火熱者二屬水寒者一瀉痢一證似乎屬熱者多屬寒者少詳玩局方專以熱澀為用若用之於下痢淸白而屬於寒者斯可矣經所謂下迫者即裏急後重之謂也其病屬火相火所謂其毒甚於熱也投以澀熱非殺之而何謹按仲景之法謂下痢脉滑而數者有宿食當下之下痢脉遲而滑者實也痢為未止急下之下痢脉反滑當有所去下之安下痢不欲食有宿食者當下之下痢腹滿痛為寒為實當下之下痢腹堅實當下之下痢譫語有燥矢當下之下痢二部皆平按之心下堅急下之下痢已差至其時復發者此為下未盡更下之安下痢脉大浮弦下之當自愈風寒下者不可下下後心下堅痛脉遲此為寒宜溫之脉浮大此為虛強下之故也設脉浮革者因而腸鳴當溫之下痢脉遲緊痛未欲止當溫之下痢心痛急當救裏可與理中四逆附子輩下痢大孔痛宜溫之觀仲景可下者十法可溫者五法謂之下者率用承氣加減何嘗以砒丹巴硇决裂燥熱重毒之劑謂之溫者率用薑附為主何嘗用鍾乳龍骨石脂栗殼緊澀燥毒之劑或曰可下者豈非腸胃有積滯乎不用砒丹巴硇恐積滯未易行也吾子以為未然幸發明承氣之意可乎豫曰大黃之寒其性善走佐以厚朴之溫善行滯氣緩以甘草之甘飲以湯液灌滌腸胃滋潤輕快無所留滯積行即止砒丹巴硇毒熱類聚劑成丸藥其氣凶暴其體重滯積氣雖行毒氣未過譬如強暴貪賊手持兵刃其可使之徘徊顧瞻於堂奧間乎借使有愈病之功其腸胃清淳之氣能免旁損暗傷之患乎仲景治痢可溫者溫可下者下或解表或利小便或待其自己區别易治難治不治之證至為詳密然猶與滯下統同立方命論其後劉河間分别在表在裏挾風挾濕挾熱挾寒挾虛明著經絡隄防傳變大槩發明滯下證治尤為切要有行血則便自安調氣則後重自除此實盲者之日月聾者之雷霆也或曰局方治法將終不能倣佛仲景之方耶豫曰圓機活法內經具舉此經意合者仲景之書也仲景因病以製方局方製藥以俟病若之何其能仿佛也宋命近臣讎校方書彼近臣者術業素異居養不同焉知為醫之事哉雖然知尊仲景矣亦未嘗不欲效之也徒以捧心效西施爾觀桃花丸一方可見矣即要略桃花湯也仲景以治便膿血用赤石脂完者乾薑粳米同煮作湯一飲病安更止後藥意謂病屬下焦血虛且寒非乾薑之溫石脂之澀且重不能止血粳米味甘引入腸胃不使重澀之體少有凝滯故煮成湯液藥行易散餘毒亦無局方不知深意不造妙理但取易於應用喜其性味溫補借為止瀉良方改為丸藥劑以麵糊日與三服其果能與仲景之意合否也或曰河間之言滯下似無挾虛挾寒者然乎否乎幸明以告我豫曰瀉痢之病水穀或化或不化並無努責惟覺困倦若滯下則不然或膿或血或膿血相雜或腸垢或無糟粕或糟粕相混雖有痛不痛大痛之異然皆裏急後重逼迫惱人考之於經察之於證似乎皆熱證實證也余近年涉厯亦有大虛大寒者不可不知敢筆其略以備采覽余從叔年踰五十夏間患滯下病微腹痛所下褐色後重頻併穀食太減時有微熱察其脉皆弦而澀似數而稍長却喜不甚浮大兩手相等視其神氣大減余曰此非滯下憂慮所致心血虧脾氣弱耳遂與參术為君當歸身陳皮為臣川芎炒白芍藥茯苓為佐使時暄熱甚加少黃蓮與兩日而安梅長官年三十餘奉養厚者夏秋間患滯下腹大痛有人教服單煮乾薑與一帖痛定少頃又作又與又定由是服乾薑至三斤八日後豫視之左脉弦而稍大似數右脉弦而大稍減亦似數重取之似緊余曰此必醉飽後喫寒涼太過當作虛寒治之因其多服乾薑遂教四物湯去地黃加人參白术陳皮酒紅花茯苓桃仁煎入生薑汁飲之至一月而安金氏婦年近四十秋初尚熱患滯下腹但隱痛夜重於晝全不得睡食亦稍减口乾不飲已得治痢靈砂二帖矣余視之兩手脉皆澀且不勻神思倦甚飲食全減因與四物湯倍加白术為君以陳皮佐之與十數帖而安此三病者若因其逼迫而用峻劑豈不誤人或曰局方諸湯可以清痰可以消積可以快氣可以化食口鼻既宜胸膈亦紓平居無事思患預防非方之良者乎豫曰清香美味誠足快意揆之造化恐未必然經曰隂平陽祕精神乃治氣為陽宜降血為隂宜升一升一降無有偏勝是謂平人今觀諸湯非豆蔻縮砂乾薑良薑之辛宜於口非丁香沈檀蘇桂之香宜於鼻和以酸鹹甘淡其將何以恱人奉養之家閒佚之際主者以此為禮賓朋以此取快不思香辛升氣漸至於散積溫成熱漸至鬱火甘味戀膈漸成中滿脾主中州本經自病傳化失職清濁不分陽亢於上隂微於下謂之隂平可乎謂之陽祕可乎將求無病適足生病將求取樂反成受苦經曰久而增氣物化之常氣增而久天之由也其病可勝言哉或曰舍利别非諸湯之類乎其香辛甘酸殆有甚焉何言論弗之及也豫曰謂之舍利别者皆取時果之液煎熬如餳而飲之稠之甚者調以沸湯南人因名之曰煎味雖甘美性非中和且如金櫻煎之縮小便杏煎楊梅蒲桃煎櫻桃煎之發胃火闕或曰局方用藥多是溫補或以為未合中道積熱痼冷二門其制作其取用吾子其無以議之矣豫曰張仲景言一百八病五勞六極七傷與婦人共三十六病孫真人言四百四病凡遇一病須分寒熱果寒耶則熱之果熱耶則寒之寒熱甚耶則反佐而制之今列病之目僅十有餘而分積熱痼冷兩門何不思之甚也要略中風脉緊為寒浮為虛肺痿吐涎不能咳不渴必遺溺此為肺中冷甘草乾薑湯溫之腹滿痛時減如故此為寒宜溫之下利欲嚏不能此腹中寒也脅下偏痛脉弦緊此寒也宜大黃附子細辛湯溫之痰飲脉雙弦者寒也黃疸發熱煩喘胸滿口燥又被火劫其汗病從濕得身盡熱而黃此熱在內宜下之下利脉數而渴設不差則清膿血以其有熱也婦人能食病七八日而更發熱者此為胃實氣熱宜大承氣下之産後七八日若太陽證小腹堅滿此惡露不盡不大便四五日發熱晡時煩燥食則妄言此熱在裏結在膀胱之薄者悔將何及若五積散之産後餘血作痛則又有不能忘言者以蒼术為君麻黃為臣厚朴枳殼為佐雖有芍藥當歸之補血僅及蒼术三分之一且其方中言婦人血氣不調心腹撮痛閉而不行並宜服之何不思産後之婦有何寒邪血氣未充似難發汗借曰推陳致新藥性溫和豈可借用麻黃之散附以蒼术枳朴虛而又虛禍不旋踵率爾用藥不思之甚或曰初産之婦好血已虧瘀血尚留黑神散非要藥歟豫曰至哉坤元萬物資生理之常也初産之婦好血未必虧汚血未必積臟腑未必寒何以藥為飲食起居勤加調護何病之有誠有汚血體怯而寒與之數帖亦自簡便或有他病當求病起何因病在何經氣病治氣血病治血寒者溫之熱者清之凝者行之虛者補之血多者止之何用海製此方不恤無病生病彼黑神散者用乾薑當歸之溫熱黑豆之甘熱地黃之微寒以補血之虛佐以炒蒲黃之甘以防出血之多芍藥之酸寒有收有散以為四藥之助官桂之大辛熱以行滯氣推凝血和以甘草之緩其為取用似乎精密然驅逐與補益似難同方施治設有性急者形瘦者本有怒火者夏月坐蓐者時有火令薑桂皆為禁藥論語未達之戒不知誰執其咎至於將護之法尤為悖理肉汁發隂經之火易成內傷之病先哲具有訓戒胡為以羊雞濃汁作糜而又常服當歸丸當歸建中湯四順理中丸雖是滋補悉犯桂附乾薑僣熱之劑臟腑無寒何處消受若夫兒之初生母腹䪺寬便啖雞子且喫火鹽不思雞子難化火鹽發熱展轉為病醫者不識每指他證率爾用藥寧不誤人余每見産婦之無疾者必教以却去黑神散與夫雞子火鹽諸般肉食且與白粥將理間以些少石首鮝煮令甘淡食之至半月以後方與少肉若雞子亦須豁開淡煮大能養胃郤疾彼富貴之家驕恣之婦卒有白帶頭風氣痛膈滿痰逆口乾經水不調髮脫體熱皆是陽勝隂虛之病天生血氣本自和平曰勝曰虛又焉知非此等謬妄有以啓之耶局方發揮
